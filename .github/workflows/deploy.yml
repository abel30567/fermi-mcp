name: Deploy

# Deploys master to Cloudflare after CI passes. Account-specific config never lives in this public
# repo: scripts/render-wrangler.mjs renders packages/worker/wrangler.jsonc from the template using
# only the `production` environment's secrets and vars. Without CLOUDFLARE_API_TOKEN there (forks,
# or before the environment is set up) the deploy job is skipped, not failed.
#
#   secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID, KV_FERMI_ID, KV_OAUTH_ID
#   vars:    WORKER_NAME, D1_DATABASE_NAME, R2_BUCKET_NAME, VECTORIZE_INDEX_NAME, FERMI_PUBLIC_URL
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Environment secrets are only readable inside a job bound to the environment, so this job
  # turns "is production configured?" into an output the deploy job's `if` can see.
  configured:
    needs: ci
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [ "$READY" != true ]; then
            echo "::notice::production environment has no CLOUDFLARE_API_TOKEN; deploy skipped"
          fi

  deploy:
    needs: configured
    if: needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - run: bun install --frozen-lockfile

      # Vars are not masked by GitHub, so mask every value (and the public host) before anything
      # can print it. The rendered file is never printed or uploaded.
      - name: Render wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_FERMI_ID: ${{ secrets.KV_FERMI_ID }}
          KV_OAUTH_ID: ${{ secrets.KV_OAUTH_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          VECTORIZE_INDEX_NAME: ${{ vars.VECTORIZE_INDEX_NAME }}
          FERMI_PUBLIC_URL: ${{ vars.FERMI_PUBLIC_URL }}
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID KV_FERMI_ID KV_OAUTH_ID WORKER_NAME \
            D1_DATABASE_NAME R2_BUCKET_NAME VECTORIZE_INDEX_NAME FERMI_PUBLIC_URL; do
            if [ -n "${!name}" ]; then echo "::add-mask::${!name}"; fi
          done
          host="${FERMI_PUBLIC_URL#https://}"
          if [ -n "${host%/}" ]; then echo "::add-mask::${host%/}"; fi
          node scripts/render-wrangler.mjs

      - name: Apply D1 migrations
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply FERMI_DB --remote

      # Output goes to a file (printed, masked, only on failure): it lists hosts and binding ids.
      # FERMI_AUTH_ENABLED is forced on: without it /mcp is public (see README).
      - name: Deploy worker
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! bunx wrangler deploy --var FERMI_AUTH_ENABLED:true > "$RUNNER_TEMP/deploy.log" 2>&1; then
            cat "$RUNNER_TEMP/deploy.log"
            exit 1
          fi

      - name: Smoke test
        env:
          FERMI_PUBLIC_URL: ${{ vars.FERMI_PUBLIC_URL }}
        run: node scripts/smoke-deploy.mjs "$RUNNER_TEMP/deploy.log"
