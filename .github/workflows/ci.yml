name: CI

on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Auto-fix lint and format
        run: bunx biome check --fix --unsafe .

      - name: Commit fixes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: auto-fix biome lint and format"
          git pull --rebase || true
          git push || true

      - name: Lint and format check
        run: bun run check

      - name: Typecheck worker
        run: bun run --cwd packages/worker typecheck

      - name: Typecheck shared
        run: npx tsc --noEmit -p packages/shared/tsconfig.json
